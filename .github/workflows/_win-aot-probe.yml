# 一次性诊断：在 windows-2022 上编 Pi-Bolt AOT 的 windows-x64，并用多种方式+长超时执行产物，
# 判定「产物问题 vs 我们的调用/harness/超时问题」。（非发布流程，用后即删。）
name: win-aot-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SOURCE_URL: https://cnb.cool/zls_nmtx/sohaha/pi-nm
  SOURCE_REF: v0.2.75

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Fetch pi-nm source (${{ env.SOURCE_REF }})
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          build_root="${GITHUB_WORKSPACE}/build-src"
          basic_auth_token="$(printf 'cnb:%s' "$CNB_TOKEN" | base64 | tr -d '\n')"
          rm -rf "$build_root"
          git init "$build_root"
          git -C "$build_root" \
            -c credential.helper= -c core.askPass= \
            -c "http.extraHeader=AUTHORIZATION: basic ${basic_auth_token}" \
            fetch --depth=1 "$SOURCE_URL" "$SOURCE_REF"
          git -C "$build_root" checkout --force FETCH_HEAD
          git -C "$build_root" rev-parse --short HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps + build:min
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          npm ci
          npm run build:min

      - name: Build AOT windows-x64 variant A (our flags)
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          bash scripts/bundle/bundle-all-bolt.sh
          mv dist/bundle/windows-x64/zpi.exe dist/bundle/windows-x64/zpi-A-ourflags.exe

      - name: Build AOT windows-x64 variant B (default max-bytecode)
        shell: bash
        env:
          BUN_JSC_maximumAOTCandidateBytecodeSize: "262144"
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          bash scripts/bundle/bundle-all-bolt.sh
          mv dist/bundle/windows-x64/zpi.exe dist/bundle/windows-x64/zpi-B-defaultmax.exe

      - name: Probe both variants
        shell: bash
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}/build-src/dist/bundle/windows-x64"

          peinfo() {
            node -e '
              const fs=require("fs");const p=process.argv[1];
              const b=fs.readFileSync(p);
              const lf=b.readUInt32LE(0x3c);
              const sig=b.toString("latin1",lf,lf+4);
              const machine=(lf+6<=b.length)?b.readUInt16LE(lf+4):-1;
              console.log("  ",p,"size",b.length,"mz",JSON.stringify(b.toString("latin1",0,2)),
                "sig",JSON.stringify(sig),"machine","0x"+Number(machine).toString(16));
            ' "$1"
          }
          runb() { local secs="$1"; shift; "$@" & local p=$! w=0
            while kill -0 "$p" 2>/dev/null; do sleep 1; w=$((w+1));
              if [ "$w" -ge "$secs" ]; then echo "  [TIMEOUT ${secs}s]"; kill -9 "$p" 2>/dev/null||true; return 124; fi; done
            wait "$p"; return $?; }

          for f in zpi-A-ourflags.exe zpi-B-defaultmax.exe; do
            echo "===== $f ====="
            ls -la "$f"
            peinfo "$f"
            echo "-- executable? --"; node -e 'const b=require("fs").readFileSync(process.argv[1]);const lf=b.readUInt32LE(0x3c);console.log("  characteristics 0x"+b.readUInt16LE(lf+4+18).toString(16),"sizeOfImage",b.readUInt32LE(lf+0x50),"sizeOfHeaders",b.readUInt32LE(lf+0x54))' "$f"
            echo "-- powershell --"; WPS="$(cygpath -w "$PWD/$f")"; powershell -NoProfile -NonInteractive -Command "& '$WPS' --version; exit \$LASTEXITCODE"; echo "  ps_rc=$?"
            echo "-- cmd (30s) --"; runb 30 cmd //c "$(cygpath -w "$PWD/$f")" --version; echo "  cmd_rc=$?"
          done
          echo "=== done ==="
