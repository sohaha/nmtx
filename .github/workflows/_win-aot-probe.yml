# 一次性诊断：Windows AOT 产物 PE 不被加载器接受的原因（单遍 vs 两遍区尺寸）。
# 非发布流程，用后即删。
name: win-aot-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SOURCE_URL: https://cnb.cool/zls_nmtx/sohaha/pi-nm
  SOURCE_REF: v0.2.75

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Fetch pi-nm source
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          build_root="${GITHUB_WORKSPACE}/build-src"
          basic_auth_token="$(printf 'cnb:%s' "$CNB_TOKEN" | base64 | tr -d '\n')"
          rm -rf "$build_root"
          git init "$build_root"
          git -C "$build_root" \
            -c credential.helper= -c core.askPass= \
            -c "http.extraHeader=AUTHORIZATION: basic ${basic_auth_token}" \
            fetch --depth=1 "$SOURCE_URL" "$SOURCE_REF"
          git -C "$build_root" checkout --force FETCH_HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps + build:min
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          npm ci
          npm run build:min

      - name: Build AOT windows-x64 (single-pass)
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          bash scripts/bundle/bundle-all-bolt.sh
          mv dist/bundle/windows-x64/zpi.exe dist/bundle/windows-x64/zpi-A-singlepass.exe

      - name: Build AOT windows-x64 (two-pass region sizes, per WINDOWS.md)
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          sizes="$PWD/.pb-region-sizes.txt"
          rm -f "$sizes"
          echo "--- pass 1 (BUN_STATIC_REGION_SIZES_OUT) ---"
          BUN_STATIC_REGION_SIZES_OUT="$sizes" bash scripts/bundle/bundle-all-bolt.sh
          echo "sizes:"; cat "$sizes" 2>/dev/null || true
          echo "--- pass 2 (BUN_STATIC_REGION_SIZES) ---"
          BUN_STATIC_REGION_SIZES="$(cat "$sizes" 2>/dev/null)" bash scripts/bundle/bundle-all-bolt.sh
          mv dist/bundle/windows-x64/zpi.exe dist/bundle/windows-x64/zpi-B-twopass.exe

      - name: Probe variants + notepad
        shell: bash
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}/build-src/dist/bundle/windows-x64"
          peinfo() {
            node -e '
              const fs=require("fs");const p=process.argv[1];const b=fs.readFileSync(p);
              const lf=b.readUInt32LE(0x3c);
              const sig=b.toString("latin1",lf,lf+4);
              const machine=b.readUInt16LE(lf+4);
              const sizeOfImage=b.readUInt32LE(lf+0x50);
              console.log(p,"| size",b.length,"| sig",JSON.stringify(sig),"| machine 0x"+machine.toString(16),
                "| SizeOfImage",sizeOfImage,"( "+(sizeOfImage/1048576).toFixed(0)+" MB )");
            ' "$1"
          }
          for f in zpi-A-singlepass.exe zpi-B-twopass.exe; do
            echo "===== $f ====="
            ls -la "$f" 2>/dev/null
            peinfo "$f" 2>/dev/null
            w="$(cygpath -w "$PWD/$f")"
            echo "-- powershell --"
            powershell -NoProfile -NonInteractive -Command "& '$w' --version; exit \$LASTEXITCODE"
            echo "  ps_rc=$?"
          done
          echo "===== notepad control ====="; peinfo "/c/Windows/System32/notepad.exe"
          echo "=== done ==="
