# 一次性诊断：在 windows-2022 上编 Pi-Bolt AOT 的 windows-x64，并用多种方式+长超时执行产物，
# 判定「产物问题 vs 我们的调用/harness/超时问题」。（非发布流程，用后即删。）
name: win-aot-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SOURCE_URL: https://cnb.cool/zls_nmtx/sohaha/pi-nm
  SOURCE_REF: v0.2.75

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Fetch pi-nm source (${{ env.SOURCE_REF }})
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          build_root="${GITHUB_WORKSPACE}/build-src"
          basic_auth_token="$(printf 'cnb:%s' "$CNB_TOKEN" | base64 | tr -d '\n')"
          rm -rf "$build_root"
          git init "$build_root"
          git -C "$build_root" \
            -c credential.helper= -c core.askPass= \
            -c "http.extraHeader=AUTHORIZATION: basic ${basic_auth_token}" \
            fetch --depth=1 "$SOURCE_URL" "$SOURCE_REF"
          git -C "$build_root" checkout --force FETCH_HEAD
          git -C "$build_root" rev-parse --short HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps + build:min
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          npm ci
          npm run build:min

      - name: Build AOT windows-x64 (no smoke)
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/build-src"
          bash scripts/bundle/bundle-all-bolt.sh

      - name: Probe the AOT exe
        shell: bash
        run: |
          set +e
          cd "${GITHUB_WORKSPACE}/build-src"
          BIN="dist/bundle/windows-x64/zpi.exe"
          WBIN="$(cygpath -w "$BIN")"
          echo "bin=$WBIN"
          ls -la "$BIN"

          peinfo() {
            node -e '
              const fs=require("fs");const p=process.argv[1];
              const b=fs.readFileSync(p);
              const mz=b.toString("latin1",0,2);
              const lf=b.readUInt32LE(0x3c);
              const sig=b.toString("latin1",lf,lf+4);
              const machine=(lf>0 && lf+6<=b.length)?b.readUInt16LE(lf+4):-1;
              const subsys=(lf>0 && lf+0x5e<=b.length)?b.readUInt16LE(lf+0x5c):-1;
              console.log("  file",p);
              console.log("  size",b.length,"mz",JSON.stringify(mz),"e_lfanew",lf,"sig",JSON.stringify(sig),
                "machine","0x"+Number(machine).toString(16),"subsystem",subsys);
            ' "$1"
          }
          echo "=== PE info: AOT zpi.exe ==="; peinfo "$BIN"
          echo "=== PE info: control notepad.exe ==="; peinfo "/c/Windows/System32/notepad.exe"

          runb() { local secs="$1"; shift; "$@" & local p=$! w=0
            while kill -0 "$p" 2>/dev/null; do sleep 1; w=$((w+1));
              if [ "$w" -ge "$secs" ]; then echo "  [TIMEOUT ${secs}s]"; kill -9 "$p" 2>/dev/null||true; return 124; fi; done
            wait "$p"; return $?; }

          echo "=== direct exec ==="
          "./$BIN" --version; echo "  real_rc=$?"
          echo "=== powershell & ==="
          powershell -NoProfile -NonInteractive -Command "& '$WBIN' --version; exit \$LASTEXITCODE"; echo "  real_rc=$?"
          echo "=== cmd /c (60s) ==="
          runb 60 cmd //c "$WBIN" --version; echo "  real_rc=$?"
          echo "=== notepad control (powershell) ==="
          powershell -NoProfile -NonInteractive -Command "\$p=Start-Process -FilePath 'C:\Windows\System32\notepad.exe' -PassThru; Start-Sleep 1; if(\$p.HasExited){'notepad exited ' + \$p.ExitCode}else{'notepad started ok'; \$p.Kill()}"
          echo "=== done ==="
